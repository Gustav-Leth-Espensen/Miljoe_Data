services:
  app:
    build: .
    environment:
      - DATABASE_URL=${DB_URL}
      - API_TOKEN=${API_TOKEN}
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - DATABASE_URL=${DB_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
       - "8000:8000"

volumes:
  db-data:

