services:
  app:
   build: .
   environment:
     DATABASE_URL: postgresql://app:test@db:5432/data_db
   depends_on:
     db:
       condition: service_healthy


  db:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: test
      POSTGRES_DB: data_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "data_db"]
      interval: 5s
      retries: 5

